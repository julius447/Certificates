<!DOCTYPE html>
<html lang="sv-SE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ampy — Certificates v2 (redesign)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/certificates-v2.css">
<style>
  /* Endast granskningsverktyg — ingår INTE i leveransen till Bricks. */
  .rev{font-family:"Outfit";max-width:1280px;margin:24px auto 0;padding:0 24px;color:#090b32}
  .rev h1{font-size:18px;font-weight:500;margin:0 0 2px}
  .rev>p{font-size:14px;font-weight:300;margin:0 0 18px;color:#4a4d68}
  .rev__grp{margin-bottom:18px}
  .rev__lbl{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
            color:#6b6e85;margin-bottom:7px}
  .rev__row{display:flex;gap:7px;flex-wrap:wrap;align-items:stretch}
  .rev__btn{font:inherit;font-size:13px;font-weight:300;text-align:left;padding:8px 13px;
            border-radius:12px;border:1px solid rgba(9,11,50,.16);background:#fff;color:#090b32;
            cursor:pointer;line-height:1.35;max-width:340px}
  .rev__btn b{display:block;font-weight:500;font-size:11px;letter-spacing:.04em;
              text-transform:uppercase;color:#8a8da3;margin-bottom:3px}
  .rev__btn[aria-pressed="true"]{background:#090b32;color:#fff;border-color:#090b32}
  .rev__btn[aria-pressed="true"] b{color:#7fd4c8}
  .rev__meta{font-size:12.5px;color:#4a4d68;margin-top:9px;font-variant-numeric:tabular-nums}
  .rev__meta b{font-weight:500;color:#090b32}
</style>
</head>
<body>

<div class="rev">
  <h1>Certificates v2 — välj copy</h1>
  <p>Bakgrund <b>B · Strömfält</b> är låst. Klicka runt och se hur raderna bryter.</p>

  <div class="rev__grp">
    <div class="rev__lbl">Rubrik (h2)</div>
    <div class="rev__row" id="pickH"></div>
  </div>

  <div class="rev__grp">
    <div class="rev__lbl">Paragraf</div>
    <div class="rev__row" id="pickP"></div>
    <div class="rev__meta" id="meta"></div>
  </div>
</div>

<!-- ====================== BLOCKET ====================== -->
<section class="cert" data-bg="b" aria-labelledby="cert-heading">

  <div class="cert__bg" aria-hidden="true">
    <!-- B · STRÖMFÄLT — tre tydligt separerade vågor, ljusare mot höger.
         preserveAspectRatio="none" gör att ingenting någonsin kan klippas —
         det var precis den buggen som gjorde den gamla vågen kantig. -->
    <svg class="cert-bg-b" viewBox="0 0 1440 356" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gb1" x1="1440" y1="60" x2="120" y2="360" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#b6f2ff" stop-opacity=".30"/><stop offset="1" stop-color="#b6f2ff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="gb2" x1="1440" y1="120" x2="180" y2="410" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".26"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="gb3" x1="1440" y1="210" x2="260" y2="450" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#8fd4e0" stop-opacity=".44"/><stop offset="1" stop-color="#8fd4e0" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M0,356 L0,224 C268,190 452,258 712,226 C972,194 1196,132 1440,100 L1440,356 Z" fill="url(#gb1)"/>
      <path d="M0,356 L0,286 C288,256 492,322 748,286 C1004,250 1216,196 1440,166 L1440,356 Z" fill="url(#gb2)"/>
      <path d="M0,356 L0,338 C308,318 528,362 788,330 C1048,298 1236,266 1440,244 L1440,356 Z" fill="url(#gb3)"/>
    </svg>
  </div>
  <div class="cert__glow" aria-hidden="true"></div>

  <div class="cert__inner">

    <div class="cert__intro">
      <h2 class="cert__heading" id="cert-heading">Därför kan du lita på oss</h2>
      <p class="cert__text">Behöriga elektriker, registrerat företag och försäkrat arbete.</p>
    </div>

    <div class="cert__marks">
      <a class="cert__mark cert__mark--in"
         href="https://www.in.se/hitta-installator/" target="_blank" rel="noopener noreferrer">
        <img src="assets/img/installatorsforetagen.svg" alt="Installatörsföretagen" width="721" height="188" loading="lazy" decoding="async">
      </a>
      <a class="cert__mark cert__mark--esv"
         href="https://www.elsakerhetsverket.se/kollaelforetaget/foretagsregister/?foretag=12047521" target="_blank" rel="noopener noreferrer">
        <img src="assets/img/elsakerhetsverket.svg" alt="Elsäkerhetsverket" width="113" height="113" loading="lazy" decoding="async">
      </a>
      <a class="cert__mark cert__mark--id06"
         href="https://id06.se/" target="_blank" rel="noopener noreferrer">
        <img src="assets/img/id06.svg" alt="ID06" width="159" height="63" loading="lazy" decoding="async">
      </a>
      <a class="cert__mark cert__mark--th"
         href="https://www.trygghansa.se/" target="_blank" rel="noopener noreferrer">
        <img src="assets/img/trygg-hansa.svg" alt="Trygg-Hansa" width="178" height="106" loading="lazy" decoding="async">
      </a>
    </div>

  </div>
</section>
<!-- ==================== /BLOCKET ==================== -->

<script>
const HEADINGS = [
  {k:'H0', tag:'nuvarande',      t:'Därför kan du lita på oss'},
  {k:'H1', tag:'substansen',     t:'Kontrollerade, anslutna och försäkrade'},
  {k:'H2', tag:'arbetet',        t:'Behörigheten bakom varje jobb'},
  {k:'H3', tag:'lågmäld',        t:'Det här står vi under'}
];
const PARAS = [
  {k:'P0', tag:'nuvarande',    t:'Behöriga elektriker, registrerat företag och försäkrat arbete.'},
  {k:'P1', tag:'telegrafisk',  t:'Behöriga elektriker. Registrerat elinstallationsföretag. Försäkrat arbete.'},
  {k:'P2', tag:'varför',       t:'Elarbete är reglerat i lag. Vi är registrerade, anslutna och försäkrade.'},
  {k:'P3', tag:'arbetet',      t:'Allt elarbete utförs av behöriga elektriker, i ett företag under tillsyn.'},
  {k:'P4', tag:'trygghetsben', t:'Behöriga elektriker, kollektivavtal och försäkring — på varje jobb.'},
  {k:'P5', tag:'löftet',       t:'Samma krav på varje jobb: behörig elektriker, registrerat företag, försäkring.'}
];

const hEl = document.querySelector('.cert__heading');
const pEl = document.querySelector('.cert__text');

function build(rowId, items, target, onPick){
  const row = document.getElementById(rowId);
  items.forEach((it, i) => {
    const b = document.createElement('button');
    b.className = 'rev__btn';
    b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    b.innerHTML = '<b>' + it.k + ' · ' + it.tag + '</b>' + it.t;
    b.addEventListener('click', () => {
      row.querySelectorAll('.rev__btn').forEach(x => x.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      target.textContent = it.t;
      onPick && onPick();
      meta();
    });
    row.appendChild(b);
  });
}

function lines(el){
  const lh = parseFloat(getComputedStyle(el).lineHeight);
  return Math.round(el.getBoundingClientRect().height / lh);
}
function meta(){
  document.getElementById('meta').innerHTML =
    'Paragraf: <b>' + pEl.textContent.length + '</b> tecken · <b>' + lines(pEl) +
    '</b> rader vid ' + window.innerWidth + 'px bred skärm. ' +
    '<span style="color:#8a8da3">Ändra fönsterbredden för att se mobilbrytningen.</span>';
}

build('pickH', HEADINGS, hEl);
build('pickP', PARAS, pEl);
meta();
addEventListener('resize', meta);
</script>
</body>
</html>
